name: Project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Run repository checks
        run: python -m unittest discover -s tests -v

      - name: Compile and run session registry tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ibackend/include backend/tests/session_registry_test.cpp \
            -o /tmp/session_registry_test
          /tmp/session_registry_test

      - name: Compile and run presence registry tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \\
            -pthread -Ibackend/include backend/tests/presence_registry_test.cpp \\
            -o /tmp/presence_registry_test
          /tmp/presence_registry_test

      - name: Compile and run identity tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ibackend/include backend/tests/external_identity_test.cpp \
            -o /tmp/external_identity_test
          /tmp/external_identity_test

          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ibackend/include backend/tests/identity_registry_test.cpp \
            -o /tmp/identity_registry_test
          /tmp/identity_registry_test

          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ibackend/include backend/src/identity/sqlite_identity_store.cpp \
            backend/tests/sqlite_identity_store_test.cpp -lsqlite3 \
            -o /tmp/sqlite_identity_store_test
          /tmp/sqlite_identity_store_test
