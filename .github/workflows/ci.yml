name: Project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository checks
        run: python -m unittest discover -s tests -v

      - name: Compile and run identity tests
        run: |
          for test in external_identity_test identity_registry_test; do
            g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
              -Ibackend/include "backend/tests/${test}.cpp" \
              -o "/tmp/${test}"
            "/tmp/${test}"
          done
